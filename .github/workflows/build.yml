name: Build_Synapse_AI_Signed

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar Cordova
        run: npm install -g cordova

      - name: Crear proyecto Cordova
        run: |
          cordova create app com.synapse.ai "Synapse_AI_V3"
          cd app
          cordova platform add android
          cordova plugin add cordova-plugin-network-information

      - name: Copiar archivos de tu app
        run: |
          rm -rf app/www/*
          cp -r www/* app/www/
          cp config.xml app/config.xml

      - name: Compilar APK
        run: |
          cd app
          cordova build android --release

      - name: Firmar APK
        run: |
          jarsigner \
          -keystore keysynapse.jks \
          -storepass Oliver12 \
          -keypass Oliver12 \
          app/platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk \
          synapsev3

      - name: Optimizar APK
        run: |
          zipalign -v 4 \
          app/platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk \
          SynapseAI_signed.apk

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: Synapse_AI_V3_APK_SIGNED
          path: SynapseAI_signed.apk
