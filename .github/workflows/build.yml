name: Generar APK Localhost

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 1. Descargar archivos del repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Java 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: 3. Compilar APK
        run: |
          # Obtenemos la ruta y la forzamos a un formato que el Builder entienda
          $sdkPath = "$env:ANDROID_SDK_ROOT\platforms"
          $androidJar = Get-ChildItem -Path $sdkPath -Filter "android.jar" -Recurse | Select-Object -First 1 -ExpandProperty FullName
          
          Write-Host "Iniciando compilación con SDK: $androidJar"

          # Ejecución con comillas reforzadas para evitar el error de "Parsing"
          .\B4ABuilder.exe -Task=Build "-Project=Proyecto.b4p" "-Args=-v -SystemJar=$androidJar -AdditionalLibraries=."

      - name: 4. Entregar APK para descargar
        uses: actions/upload-artifact@v4
        with:
          name: MiApp_Instalable
          path: "**/*.apk"
