name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Instalar Cordova
        run: npm install -g cordova

      - name: Crear proyecto Cordova
        run: |
          cordova create app com.synapse.ai SynapseAI
          cd app

          rm -rf www
          cp -r ../www www
          cp ../config.xml config.xml

      - name: Agregar plataforma Android
        run: |
          cd app
          cordova platform add android@12

      - name: Build APK
        run: |
          cd app
          cordova build android --release

      - name: Firmar APK
        run: |
          cd app/platforms/android/app/build/outputs/apk/release

          jarsigner \
          -verbose \
          -sigalg SHA256withRSA \
          -digestalg SHA-256 \
          -keystore ../../../../../../../keysynapse.jks \
          -storepass Oliver12 \
          -keypass Oliver12 \
          app-release-unsigned.apk synapsev3

          mv app-release-unsigned.apk SynapseAI.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SynapseAI_APK
          path: app/platforms/android/app/build/outputs/apk/release/SynapseAI.apk
