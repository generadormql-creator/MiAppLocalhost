name: Compilacion_Synapse_V3_Final
on: [push, workflow_dispatch]

jobs:
  construir_apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Compilacion Directa
        run: |
          set -e
          npm install -g cordova
          
          # 1. Crear proyecto
          cordova create app_folder com.synapse.ai "Synapse_AI_V3"
          cd app_folder
          cordova platform add android
          cordova plugin add cordova-plugin-network-information
          
          # 2. Sincronizar tus archivos
          rm -rf www/*
          cp -rv ../www/* www/
          cp -f ../config.xml config.xml
          
          # 3. EL TRUCO: Copiamos la llave DENTRO de la carpeta de Android directamente
          cp ../keysynapse.jks platforms/android/app/keysynapse.jks
          
          # 4. Compilar: Como la llave está en la misma carpeta que el build.gradle, la ruta es simple
          cd platforms/android/app
          cordova build android --release --device --no-telemetry -- \
            --keystore="keysynapse.jks" \
            --storePassword="Oliver12" \
            --alias="synapsev3" \
            --password="Oliver12"

      - name: Localizar y Mover APK
        if: success()
        run: |
          # Buscamos el APK y lo traemos a la raíz
          find . -name "*-release.apk" -exec cp {} ./synapse_v3_final.apk \;

      - name: Subir Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Synapse_AI_V3_Firmada
          path: synapse_v3_final.apk
