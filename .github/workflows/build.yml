name: Generar APK con Cordova
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Compilar
        run: |
          npm install -g cordova
          cordova create myApp com.localhost.myapp "MiApp"
          cd myApp
          cordova platform add android
          rm -rf www/*
          cp -r ../www/* www/
          cordova build android --no-telemetry
      - name: Subir
        uses: actions/upload-artifact@v4
        with:
          name: MiApp_APK
          path: myApp/platforms/android/app/build/outputs/apk/debug/*.apk
