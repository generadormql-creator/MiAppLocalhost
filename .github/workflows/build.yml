name: Compilacion_Synapse_AI

on: [push, workflow_dispatch]

jobs:
  construir_apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Cordova
        run: npm install -g cordova

      - name: Crear y Configurar App
        run: |
          cordova create app com.synapse.ai SynapseAI
          cd app
          cordova platform add android
          cordova plugin add cordova-plugin-network-information

          rm -rf www/*
          cp -r ../www/* www/
          cp ../config.xml config.xml

          cordova build android --debug

      - name: Mostrar APK generado
        run: find . -name "*.apk"

      - name: Firmar APK
        run: |
          APK=$(find . -name "*.apk" | head -n 1)
          echo "APK encontrado: $APK"

          jarsigner \
          -keystore keysynapse.jks \
          -storepass Oliver12 \
          -keypass Oliver12 \
          "$APK" \
          synapsev3

          cp "$APK" SynapseAI_signed.apk

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: Synapse_AI_APK_SIGNED
          path: SynapseAI_signed.apk
