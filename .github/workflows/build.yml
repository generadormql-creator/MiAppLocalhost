name: Compilacion_Synapse_V3_Release
on: [push, workflow_dispatch]

jobs:
  construir_apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Preparar Entorno y Cordova
        run: |
          npm install -g cordova
          # Usamos un nombre de carpeta sin espacios para el proceso interno
          cordova create app com.synapse.ai "Synapse_AI_V3"
          cd app
          cordova platform add android
          cordova plugin add cordova-plugin-network-information
          rm -rf www/*
          cp -rv ../www/* www/
          cp -f ../config.xml config.xml
          
          # COMPILACIÓN FIRMADA USANDO RUTA ABSOLUTA
          # $GITHUB_WORKSPACE apunta a la raíz donde subiste el .jks
          cordova build android --release --no-telemetry -- --keystore=$GITHUB_WORKSPACE/keysynapse.jks --storePassword=Oliver12 --alias=synapsev3 --password=Oliver12

      - name: Guardar APK Final Firmada
        uses: actions/upload-artifact@v4
        with:
          name: Synapse_AI_V3_PRO_Firmada
          path: "**/*.apk"
          if-no-files-found: error
