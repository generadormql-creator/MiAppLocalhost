name: Generar APK Localhost

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Esto te permite darle a un botón para compilar cuando quieras

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar B4A Builder (Cloud)
        uses: sstsoft/b4a-action@v1
        with:
          project_file: 'Proyecto.b4p' # El nombre de tu archivo .b4p
          
      - name: Subir APK generada
        uses: actions/upload-artifact@v4
        with:
          name: MiApp_Instalable
          path: "**/*.apk"
