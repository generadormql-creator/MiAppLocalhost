name: Compilacion_Synapse_V3_Final
on: [push, workflow_dispatch]

jobs:
  construir_apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Compilacion Profesional
        run: |
          set -e
          npm install -g cordova
          
          # 1. Crear proyecto en una carpeta limpia
          cordova create proyecto com.synapse.ai "Synapse_AI_V3"
          cd proyecto
          
          # 2. Configurar plataforma y plugins
          cordova platform add android
          cordova plugin add cordova-plugin-network-information
          
          # 3. Limpiar y copiar tus archivos de la carpeta www del repo
          rm -rf www/*
          cp -rv ${{ github.workspace }}/www/* www/
          cp -f ${{ github.workspace }}/config.xml config.xml
          
          # 4. Compilar usando la ruta ABSOLUTA de la llave
          # ${{ github.workspace }} es la raiz donde esta tu keysynapse.jks
          cordova build android --release --device --no-telemetry -- \
            --keystore="${{ github.workspace }}/keysynapse.jks" \
            --storePassword="Oliver12" \
            --alias="synapsev3" \
            --password="Oliver12"

      - name: Localizar y Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: Synapse_AI_V3_Firmada
          # Buscamos cualquier APK que se haya generado en el proceso
          path: "**/*.apk"
          if-no-files-found: error
