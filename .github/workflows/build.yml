name: Generar APK Localhost

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 1. Descargar archivos del repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Java 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: 3. Localizar Android SDK y Compilar
        run: |
          # Buscamos la ruta del SDK de Android que ya viene en el servidor de GitHub
          $androidJar = Get-ChildItem -Path "C:\Microsoft\AndroidSDK\25\platforms" -Filter "android.jar" -Recurse | Select-Object -First 1 -ExpandProperty FullName
          Write-Host "Usando SDK en: $androidJar"
          
          # Ejecutamos el compilador que subiste
          # -AdditionalLibraries=. le dice que las librerías están en la raíz junto al .exe
          .\B4ABuilder.exe -Task=Build -Project=Proyecto.b4p -Args="-v -SystemJar=$androidJar -AdditionalLibraries=."

      - name: 4. Entregar APK para descargar
        uses: actions/upload-artifact@v4
        with:
          name: MiApp_Instalable
          path: "**/*.apk"
