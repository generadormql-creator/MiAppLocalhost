name: Generar APK Localhost

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest # Cambiamos a Windows porque B4A es nativo de ahí
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Instalar Java 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Descargar B4A Builder
        run: |
          Invoke-WebRequest -Uri "https://www.b4x.com/android/files/B4ABuilder.zip" -OutFile "B4ABuilder.zip"
          Expand-Archive -Path "B4ABuilder.zip" -DestinationPath "B4ABuilder"

      - name: Compilar APK
        run: |
          # Aquí el comando para compilar usando el builder oficial
          # Nota: Asegúrate que el nombre Proyecto.b4p sea idéntico al que subiste
          .\B4ABuilder\B4ABuilder.exe -Task=Build -Project=Proyecto.b4p

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: MiApp_Instalable
          path: Objects/*.apk
