name: Firmar_APK

on:
  push:
  workflow_dispatch:

jobs:
  sign:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Android Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apksigner zipalign

      - name: Alinear APK
        run: |
          zipalign -v 4 app-debug.apk aligned.apk

      - name: Firmar APK correctamente
        run: |
          apksigner sign \
          --ks keysynapse.jks \
          --ks-key-alias synapsev3 \
          --ks-pass pass:Oliver12 \
          --key-pass pass:Oliver12 \
          --out SynapseAI_signed.apk \
          aligned.apk

      - name: Verificar firma
        run: |
          apksigner verify SynapseAI_signed.apk

      - name: Subir APK firmado
        uses: actions/upload-artifact@v4
        with:
          name: SynapseAI_signed
          path: SynapseAI_signed.apk
