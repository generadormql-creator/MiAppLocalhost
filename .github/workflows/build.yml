name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    container:
      image: mingc/android-build-box:latest

    steps:

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Instalar Cordova y Android platform
        run: |
          npm install -g cordova
          npm install -g cordova-android@11

      - name: Crear proyecto Cordova
        run: |
          cordova create app com.synapse.ai SynapseAI
          cd app

          cordova platform add android

          rm -rf www
          cp -r ../www www
          cp ../config.xml config.xml

      - name: Compilar APK release
        run: |
          cd app
          cordova build android --release

      - name: Firmar APK
        run: |
          cd app/platforms/android/app/build/outputs/apk/release

          jarsigner \
          -verbose \
          -sigalg SHA256withRSA \
          -digestalg SHA-256 \
          -keystore ../../../../../../../keysynapse.jks \
          -storepass Oliver12 \
          -keypass Oliver12 \
          app-release-unsigned.apk synapsev3

          mv app-release-unsigned.apk SynapseAI.apk

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: SynapseAI_APK
          path: app/platforms/android/app/build/outputs/apk/release/SynapseAI.apk
