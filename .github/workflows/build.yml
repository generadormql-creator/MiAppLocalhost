name: Compilacion_Synapse_V3_Release
on: [push, workflow_dispatch]

jobs:
  construir_apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Preparar y Compilar
        run: |
          npm install -g cordova
          # Creamos la carpeta
          cordova create proyecto com.synapse.ai "Synapse_AI_V3"
          cd proyecto
          
          # Añadimos plataforma y plugin
          cordova platform add android
          cordova plugin add cordova-plugin-network-information
          
          # Copiamos tus archivos (subiendo un nivel para encontrarlos)
          rm -rf www/*
          cp -rv ../www/* www/
          cp -f ../config.xml config.xml
          cp ../keysynapse.jks .
          
          # COMPILACIÓN DIRECTA (Aquí está el cambio clave)
          cordova build android --release --no-telemetry -- --keystore=keysynapse.jks --storePassword=Oliver12 --alias=synapsev3 --password=Oliver12

      - name: Encontrar y Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Synapse_AI_V3_PRO_Firmada
          # Buscamos en todo el servidor por si acaso
          path: "**/proyecto/platforms/android/app/build/outputs/apk/release/*.apk"
          if-no-files-found: error
