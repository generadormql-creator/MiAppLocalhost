name: Compilacion_Synapse_V3_Release
on: [push, workflow_dispatch]

jobs:
  construir_apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Preparar Entorno y Cordova
        run: |
          npm install -g cordova
          cordova create app com.synapse.ai "Synapse_AI_V3"
          cd app
          cordova platform add android
          cordova plugin add cordova-plugin-network-information
          rm -rf www/*
          cp -rv ../www/* www/
          cp -f ../config.xml config.xml
          
          # COPIAR LA LLAVE AL LUGAR DE TRABAJO
          cp ../keysynapse.jks .
          
          # COMPILACIÓN FIRMADA (FORZANDO APK)
          # Usamos --buildConfig para evitar errores de parámetros
          echo "android {
              signingConfigs {
                  release {
                      storeFile file('../keysynapse.jks')
                      storePassword 'Oliver12'
                      keyAlias 'synapsev3'
                      keyPassword 'Oliver12'
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }" > platforms/android/release-signing.properties

          # Ejecutamos el build de forma simple
          cordova build android --release --no-telemetry -- --keystore=../keysynapse.jks --storePassword=Oliver12 --alias=synapsev3 --password=Oliver12

      - name: Mover APK a la raíz (Para no perderla)
        run: |
          find . -name "*.apk" -exec cp {} ./synapse_final.apk \;
          ls -R # Esto nos mostrará en el log qué carpetas se crearon

      - name: Guardar APK Final Firmada
        uses: actions/upload-artifact@v4
        with:
          name: Synapse_AI_V3_PRO_Firmada
          path: synapse_final.apk
          if-no-files-found: error
