name: Generar APK con Cordova

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Descargar archivos del repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 4. Instalar Cordova
        run: npm install -g cordova

      - name: 5. Crear Proyecto y Preparar Archivos
        run: |
          # Creamos la estructura base de la App
          cordova create myApp com.localhost.myapp "MiAppLocal"
          cd myApp
          cordova platform add android
          
          # Limpiamos la carpeta www por defecto de Cordova
          rm -rf www/*
          
          # Copiamos tus archivos desde la carpeta 'www' de tu repositorio
          cp -r ../www/* www/
          
          # Verificamos que el index.html esté en su sitio
          ls -l www/

      - name: 6. Compilar APK (Debug)
        run: |
          cd myApp
          # Aceptamos licencias de Android automáticamente
          yes | sdkmanager --licenses || true
          # Compilamos el proyecto
          cordova build android --no-telemetry --release

      - name: 7. Subir APK Final
        uses: actions/upload-artifact@v4
        with:
          name: MiApp_Instalable_APK
          # Buscamos el archivo .apk generado en las carpetas de salida
          path: myApp/platforms/android/app/build/outputs/apk/**/*.apk
