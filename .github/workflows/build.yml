name: Build APK Firmada

on:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Instalar Cordova
      run: |
        npm install -g cordova

    - name: Setup Java 11 (COMPATIBLE CON CORDOVA)
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 11

    - name: Instalar Android SDK
      uses: android-actions/setup-android@v3

    - name: Instalar dependencias Android
      run: |
        sdkmanager "platform-tools"
        sdkmanager "platforms;android-33"
        sdkmanager "build-tools;33.0.2"

    - name: Preparar proyecto Cordova
      run: |
        cd proyecto

        # borrar android viejo para evitar conflictos
        cordova platform remove android || true

        # instalar version estable
        cordova platform add android@11

    - name: Build APK Release
      run: |
        cd proyecto
        cordova build android --release

    - name: Firmar APK
      run: |

        cd proyecto/platforms/android/app/build/outputs/apk/release

        keytool -genkey -v \
          -keystore release-key.keystore \
          -alias synapse \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -storepass 123456 \
          -keypass 123456 \
          -dname "CN=Synapse, OU=Dev, O=AI, L=World, S=World, C=US"

        jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
          -keystore release-key.keystore \
          -storepass 123456 \
          -keypass 123456 \
          app-release-unsigned.apk synapse

        mv app-release-unsigned.apk Synapse_AI_V3.apk

    - name: Subir APK
      uses: actions/upload-artifact@v4
      with:
        name: Synapse_AI_V3_Firmada
        path: proyecto/platforms/android/app/build/outputs/apk/release/Synapse_AI_V3.apk
