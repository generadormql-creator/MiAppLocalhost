name: Generar APK Localhost

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 1. Descargar archivos
        uses: actions/checkout@v4

      - name: 2. Configurar Java 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: 3. Ejecutar Compilador (.bat)
        run: |
          # Obtenemos la ruta del SDK (usamos la API 33 o 34 que ya vimos que existe)
          $androidJar = Get-ChildItem -Path "$env:ANDROID_SDK_ROOT\platforms" -Filter "android.jar" -Recurse | Select-Object -First 1 -ExpandProperty FullName
          
          Write-Host "Enviando al BAT la ruta: $androidJar"
          
          # Llamada limpia al BAT
          cmd.exe /c "compilar.bat $androidJar"

      - name: 4. Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: MiApp_Instalable
          path: "**/*.apk"
