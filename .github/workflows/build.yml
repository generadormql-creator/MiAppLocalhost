name: Build_Synapse_AI_Signed

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repo
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar Cordova
        run: npm install -g cordova

      - name: Crear proyecto
        run: |
          cordova create app com.synapse.ai SynapseAI
          cd app
          cordova platform add android
          cordova plugin add cordova-plugin-network-information

      - name: Copiar tu app
        run: |
          rm -rf app/www/*
          cp -r www/* app/www/
          cp config.xml app/config.xml

      - name: Compilar APK release
        run: |
          cd app
          cordova build android --release --no-telemetry

      - name: Buscar APK generado
        run: |
          find . -name "*.apk"

      - name: Firmar APK automáticamente
        run: |
          APK=$(find . -name "*release*.apk" | head -n 1)
          echo "APK encontrado: $APK"

          jarsigner \
          -keystore keysynapse.jks \
          -storepass Oliver12 \
          -keypass Oliver12 \
          "$APK" \
          synapsev3

          cp "$APK" SynapseAI_signed.apk

      - name: Subir APK firmado
        uses: actions/upload-artifact@v4
        with:
          name: Synapse_AI_V3_SIGNED
          path: SynapseAI_signed.apk
