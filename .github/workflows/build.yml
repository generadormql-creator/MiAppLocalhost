name: Generar APK Localhost

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Instalar Java 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Descargar B4A Builder y Librerias Faltantes
        run: |
          # Descargamos el compilador
          Invoke-WebRequest -Uri "https://www.b4x.com/android/files/b4abuilder.zip" -OutFile "B4ABuilder.zip"
          Expand-Archive -Path "B4ABuilder.zip" -DestinationPath "B4ABuilder"
          
          # DESCARGAR JAVAOBJECT (Ya que no la tienes)
          Invoke-WebRequest -Uri "https://www.b4x.com/android/files/JavaObject.zip" -OutFile "JavaObject.zip"
          Expand-Archive -Path "JavaObject.zip" -DestinationPath "."
          # Esto dejará JavaObject.jar y JavaObject.xml en tu carpeta principal

      - name: Compilar APK
        run: |
          # Localizamos el motor de Android en el servidor
          $androidJar = Get-ChildItem -Path "C:\Microsoft\AndroidSDK\25\platforms" -Filter "android.jar" -Recurse | Select-Object -First 1 -ExpandProperty FullName
          
          # Compilación final
          # -AdditionalLibraries=. le dice que use los archivos que subiste y los que descargamos
          .\B4ABuilder\B4ABuilder.exe -Task=Build -Project=Proyecto.b4p -Args="-v -SystemJar=$androidJar -AdditionalLibraries=."

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: MiApp_Instalable
          path: "**/*.apk"
