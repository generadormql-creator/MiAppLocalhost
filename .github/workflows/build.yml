name: Generar APK Localhost

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 1. Descargar archivos del repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Java 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: 3. Compilar APK
        run: |
          # Detectamos la ruta del SDK
          $sdkPath = "$env:ANDROID_SDK_ROOT\platforms"
          $androidJar = Get-ChildItem -Path $sdkPath -Filter "android.jar" -Recurse | Select-Object -First 1 -ExpandProperty FullName
          
          Write-Host "Compilando proyecto: Proyecto.b4p"
          Write-Host "Usando SDK: $androidJar"

          # FORMATO SIMPLIFICADO: 
          # Quitamos el -v y el -Task para ver si el Builder arranca con lo mínimo
          .\B4ABuilder.exe -Project=Proyecto.b4p -SystemJar="$androidJar" -AdditionalLibraries="."

      - name: 4. Entregar APK para descargar
        uses: actions/upload-artifact@v4
        with:
          name: MiApp_Instalable
          path: "**/*.apk"
