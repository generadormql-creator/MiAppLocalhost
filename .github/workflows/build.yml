name: Compilacion_Synapse_AI
on: [push, workflow_dispatch]

jobs:
  construir_apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Crear y Configurar App
        run: |
          npm install -g cordova
          cordova create app com.synapse.ai "Synapse AI V3"
          cd app
          cordova platform add android
          
          # Plugin para detectar Red/Internet
          cordova plugin add cordova-plugin-network-information
          
          rm -rf www/*
          cp -rv ../www/* www/
          
          # Sobreescribimos el config.xml de la app con el tuyo
          cp -f ../config.xml config.xml
          
          cordova build android --no-telemetry

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Synapse_AI_V3_APK
          path: app/platforms/android/app/build/outputs/apk/debug/*.apk
