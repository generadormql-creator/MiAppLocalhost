name: Compilacion_Synapse_V3_Release
on: [push, workflow_dispatch]

jobs:
  construir_apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Preparar Entorno y Cordova
        run: |
          npm install -g cordova
          # Creamos la carpeta del proyecto
          cordova create app com.synapse.ai "Synapse_AI_V3"
          cd app
          cordova platform add android
          
          # Plugin necesario para detectar internet
          cordova plugin add cordova-plugin-network-information
          
          # Limpiamos y copiamos tu HTML/JS/CSS e Icono
          rm -rf www/*
          cp -rv ../www/* www/
          
          # Copiamos tu config.xml personalizado
          cp -f ../config.xml config.xml
          
          # COMPILACIÓN FIRMADA (RELEASE)
          # Usamos los datos de tu llave: keysynapse.jks / Oliver12 / synapsev3
          cordova build android --release --no-telemetry -- --keystore=../keysynapse.jks --storePassword=Oliver12 --alias=synapsev3 --password=Oliver12

      - name: Listar archivos para verificar ruta
        run: find . -name "*.apk"

      - name: Guardar APK Final Firmada
        uses: actions/upload-artifact@v4
        with:
          name: Synapse_AI_V3_PRO_Firmada
          # Esta ruta buscará cualquier APK generado, asegurando que no falle por la ruta
          path: "**/*.apk"
          if-no-files-found: error
