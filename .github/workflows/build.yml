name: Firmar_APK_Debug

on:
  push:
  workflow_dispatch:

jobs:
  sign_apk:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Ver archivos
        run: ls -la

      - name: Firmar APK
        run: |
          jarsigner \
          -keystore keysynapse.jks \
          -storepass Oliver12 \
          -keypass Oliver12 \
          app-debug.apk \
          synapsev3

      - name: Copiar APK firmado
        run: cp app-debug.apk SynapseAI_signed.apk

      - name: Verificar firma
        run: jarsigner -verify -verbose -certs SynapseAI_signed.apk

      - name: Subir APK firmado
        uses: actions/upload-artifact@v4
        with:
          name: SynapseAI_signed
          path: SynapseAI_signed.apk
