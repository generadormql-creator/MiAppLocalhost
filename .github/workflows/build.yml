name: Compilacion_Synapse_V3_Final
on: [push, workflow_dispatch]

jobs:
  construir_apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Compilacion con Paradas de Seguridad
        run: |
          # 1. Detener el proceso si algo falla
          set -e
          
          # 2. Instalar Cordova
          npm install -g cordova
          
          # 3. Verificar que la llave existe en la raíz
          if [ ! -f "keysynapse.jks" ]; then
            echo "ERROR: El archivo keysynapse.jks no se encuentra en la raiz del repositorio."
            exit 1
          fi

          # 4. Crear proyecto y configurar
          cordova create tmp_app com.synapse.ai "Synapse_AI_V3"
          cd tmp_app
          cordova platform add android
          cordova plugin add cordova-plugin-network-information
          
          # 5. Sincronizar archivos
          rm -rf www/*
          cp -rv ../www/* www/
          cp -f ../config.xml config.xml
          
          # 6. Compilar con ruta absoluta para la Keystore
          # Usamos --device para asegurar formato APK de distribucion
          cordova build android --release --device --no-telemetry -- \
            --keystore="../../keysynapse.jks" \
            --storePassword="Oliver12" \
            --alias="synapsev3" \
            --password="Oliver12"

      - name: Localizar y Mover APK
        if: success()
        run: |
          # Buscamos el APK generado y lo movemos a la raiz para el upload
          find . -name "*-release.apk" -exec cp {} ../synapse_v3_final.apk \;
          echo "Archivo localizado y listo para subir."

      - name: Subir Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Synapse_AI_V3_Firmada
          path: synapse_v3_final.apk
