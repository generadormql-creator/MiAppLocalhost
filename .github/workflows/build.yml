name: Generar APK Localhost

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar B4A y Compilar
        # Usamos una acción mantenida que ya conoce las rutas de Android en GitHub
        uses: sstsoft/b4a-action@v1.1
        with:
          project_file: 'Proyecto.b4p' # Asegúrate de que este nombre sea exacto al de tu archivo
          
      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: MiApp_Instalable
          path: "**/*.apk"
